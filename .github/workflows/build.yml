          # ================================================================ MOD ASSETS
          from scipy.signal import butter, sosfilt
          MODRES = os.environ.get("AURORA_MODRES", "/home/claude/mod/src/main/resources")

          PROFILES = {
              #           body freqs (Hz)        body decay  noise lp  tick amp  tick hz
              "creamy": ([170, 410, 880],        .020,       1300,     .06,      2600),
              "thocky": ([115, 260, 560],        .030,       900,      .03,      2000),
              "clacky": ([900, 1900, 3400],      .012,       5000,     .45,      4200),
          }

          def lp(x, hz): return sosfilt(butter(4, hz, "low", fs=SR, output="sos"), x)

          def keyhit(profile, kind, seed):
              r = np.random.default_rng(seed)
              freqs, dec, lpf, tick_amp, tick_hz = PROFILES[profile]
              dur = .16 if kind == "big" else .1
              n = int(dur * SR); t = np.arange(n) / SR
              var = 1 + r.uniform(-.06, .06)
              if kind == "release":
                  var *= 1.35; dec *= .6
              body = sum(np.sin(2 * np.pi * f * var * t + r.random()) * np.exp(-t / (dec * (1.6 if i == 0 else 1 / (i + .5))))
                         / (i + 1) for i, f in enumerate(freqs))
              noise = lp(r.standard_normal(n), lpf * var) * np.exp(-t / (dec * .5))
              tick = np.sin(2 * np.pi * tick_hz * var * t) * np.exp(-t / .002) * tick_amp
              s = body * .9 + noise * .5 + tick
              if kind == "big":  # stabiliser rattle on spacebar / enter
                  rat = np.zeros(n); i0 = int(.011 * SR)
                  rat[i0:] = (body[: n - i0] * .35 + lp(r.standard_normal(n - i0), lpf * .8) * np.exp(-t[: n - i0] / .02) * .3)
                  s = s * 1.1 + rat
                  s = lp(s, lpf * 1.4)
              s *= np.minimum(t / .0004, 1)
              return s * (.45 if kind == "release" else 1)

          def build_mod_assets():
              print("mod assets...")
