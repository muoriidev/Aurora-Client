          package dev.aurora;

          public final class Palette {
              public record Swatch(String name, int rgb) {}

              public static final Swatch[] COLORS = {
                      new Swatch("Aurora Lila", 0x8B5CFF),
                      new Swatch("Nordlicht Grün", 0x21FF9B),
                      new Swatch("Eisblau", 0x4FC3FF),
                      new Swatch("Sunset Pink", 0xFF5C9D),
                      new Swatch("Gold", 0xFFC24B),
                      new Swatch("Weiß", 0xF2F2FF),
              };

              public static int argb(int alpha, int rgb) { return (alpha & 0xFF) << 24 | (rgb & 0xFFFFFF); }

              public static int lerp(float t, int a, int b) {
                  t = Math.max(0f, Math.min(1f, t));
                  int r = 0;
                  for (int s = 0; s <= 24; s += 8) {
                      int ca = (a >>> s) & 0xFF, cb = (b >>> s) & 0xFF;
                      r |= (Math.round(ca + (cb - ca) * t) & 0xFF) << s;
                  }
                  return r;
              }

              private Palette() {}
          }
          AURORA_EOF
