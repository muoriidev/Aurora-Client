                  ctx.drawCenteredTextWithShadow(textRenderer, Text.literal("✦ AURORA SKIES ✦"), 0, 0, Palette.argb(0xFF, accent));
                  ctx.getMatrices().pop();
                  ctx.drawCenteredTextWithShadow(textRenderer, Text.literal("Rechts-Shift öffnet dieses Menü").formatted(Formatting.GRAY),
                          width / 2, panelY + panelH + 4, 0xFFFFFFFF);
              }

              @Override
              public void close() {
                  AuroraConfig.save();
                  if (packDirty) AuroraClient.applyPacks();
                  if (client != null) client.setScreen(parent);
              }
