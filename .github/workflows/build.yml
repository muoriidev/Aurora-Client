              save_json(f"{MODRES}/assets/aurora/sounds.json", sj)
              # cursor glow texture (soft radial, white -> tinted at runtime)
              S = 128
              yy, xx = np.mgrid[0:S, 0:S]; r = np.hypot(xx - S / 2 + .5, yy - S / 2 + .5) / (S / 2)
              a = np.clip(np.exp(-(r / .45) ** 2) * 1.05 - .02, 0, 1) * (r < 1)
              Image.fromarray(np.dstack([np.full((S, S, 3), 255, np.uint8), (a * 255).astype(np.uint8)]), "RGBA").save(
                  mk(f"{MODRES}/assets/aurora/textures/gui/glow.png"))
              shutil.copy(f"{PACK}/pack.png", mk(f"{MODRES}/assets/aurora/icon.png"))
              dst = f"{MODRES}/resourcepacks/aurora_skies"
              shutil.rmtree(dst, ignore_errors=True)
