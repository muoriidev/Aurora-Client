                  // --- Fertig
                  y += step + 6;
                  addDrawableChild(ButtonWidget.builder(Text.literal("Fertig"), b -> close())
                          .dimensions(width / 2 - 100, y, 200, bh).build());
              }

              @Override
              public void renderBackground(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  super.renderBackground(ctx, mouseX, mouseY, delta);
                  int accent = AuroraConfig.INSTANCE.rgb();
                  ctx.fillGradient(panelX, panelY, panelX + panelW, panelY + panelH, 0xD0101020, 0xD0060610);
                  ctx.fill(panelX, panelY, panelX + panelW, panelY + 2, Palette.argb(0xFF, accent));
                  ctx.fill(panelX, panelY + panelH - 1, panelX + panelW, panelY + panelH, Palette.argb(0x80, accent));
