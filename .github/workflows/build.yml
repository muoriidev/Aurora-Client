                                     "rotation": {"static": [0, 0, 0], "axis": [0, 0, 90 if name == "night" else 0],
                                                  "rotationSpeedY": 0.2 if name in ("night", "end") else 0},
                                     "changeFog": False, "sunSkyTint": False},
                      "textures": {f: f"{NS}:textures/sky/{name}/{f}.png" for f in FACES},
                      "blend": {"type": "alpha"},
                      "decorations": {"showSun": name != "end", "showMoon": name != "end", "showStars": False},
                  })
                  # preview (wide strip)
                  W, H = 1920, 1080
                  x = (np.arange(W) + .5) / W * 2 - 1
                  y = (np.arange(H) + .5) / H * 2 - 1
                  xx, yy = np.meshgrid(x * 1.6, -y * .9 + .35)
                  dd = np.stack([xx, yy, -np.ones_like(xx)], -1)
                  dd /= np.linalg.norm(dd, axis=-1, keepdims=True)
                  to_img(with_landscape(THEMES[name], dd)).save(mk(f"{OUT}/previews/{i}_{name}.png"))

              print("panorama...")
