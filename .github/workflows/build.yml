          package dev.aurora.gui;

          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.text.Text;

          import java.util.function.DoubleConsumer;
          import java.util.function.DoubleFunction;

          /** Schieberegler von min bis max mit eigener Beschriftung. */
          public class ValueSlider extends SliderWidget {
              private final double min, max;
              private final DoubleConsumer setter;
              private final DoubleFunction<Text> label;

              public ValueSlider(int x, int y, int w, int h, double min, double max, double current,
                                 DoubleConsumer setter, DoubleFunction<Text> label) {
                  super(x, y, w, h, Text.empty(), (current - min) / (max - min));
                  this.min = min; this.max = max; this.setter = setter; this.label = label;
                  updateMessage();
              }

              private double real() { return min + (max - min) * value; }

              @Override protected void updateMessage() { setMessage(label.apply(real())); }
              @Override protected void applyValue() { setter.accept(real()); }
          }
          AURORA_EOF
