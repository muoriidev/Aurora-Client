                          write_ogg(keyhit(prof, kind, zlib.crc32(f"{prof}/{kind}/{k}".encode())), f"{MODRES}/assets/aurora/sounds/{rel}.ogg")
                          names.append(f"aurora:{rel}")
                      sj[f"key.{prof}.{kind}"] = {"sounds": names, "subtitle": "subtitles.aurora.key"}
              for kind in ("press", "release", "big"):  # Profil "Eigene": Fallback auf Creamy, per Resource-Pack ersetzbar
