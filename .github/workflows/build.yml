                  // --- Tastatur-Sounds
                  y += step;
                  addDrawableChild(ButtonWidget.builder(onOff("Tastatur-Sounds", c.keySounds), b -> {
                      c.keySounds = !c.keySounds; b.setMessage(onOff("Tastatur-Sounds", c.keySounds));
                  }).dimensions(lx, y, bw, bh).build());
                  addDrawableChild(ButtonWidget.builder(onOff("Auch im Spiel", c.keySoundsInGame), b -> {
                      c.keySoundsInGame = !c.keySoundsInGame; b.setMessage(onOff("Auch im Spiel", c.keySoundsInGame));
                  }).dimensions(rx, y, bw, bh).build());
                  y += step;
                  addDrawableChild(ButtonWidget.builder(value("Switch", KeySounds.PROFILE_NAMES[c.keyProfile]), b -> {
                      c.keyProfile = (c.keyProfile + 1) % KeySounds.PROFILES.length;
