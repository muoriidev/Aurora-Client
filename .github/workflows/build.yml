                  addDrawableChild(ButtonWidget.builder(onOff("Glow-Spur", c.cursorTrail), b -> {
                      c.cursorTrail = !c.cursorTrail; b.setMessage(onOff("Glow-Spur", c.cursorTrail));
                  }).dimensions(rx, y, bw, bh).build());
                  y += step;
                  addDrawableChild(ButtonWidget.builder(value("Farbe", Palette.COLORS[c.color].name()), b -> {
                      c.color = (c.color + 1) % Palette.COLORS.length;
