      - name: Generatoren fuer Himmel und Sounds anlegen
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'gen/build.py')"
          cat > 'gen/build.py' <<'AURORA_EOF'
          """Generator for the 'Aurora Skies' Minecraft resource pack.
          All textures and sounds are procedurally generated (original content)."""
          import json, os, shutil, subprocess, wave, zipfile, zlib
          import numpy as np
          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          HERE = os.path.dirname(os.path.abspath(__file__))
          OUT = os.environ.get("AURORA_OUT", "/home/claude/out")
          PACK = os.path.join(OUT, "AuroraSkies")
          NS = "aurora"
          rng = np.random.default_rng(1337)

          def mk(p):
              os.makedirs(os.path.dirname(p), exist_ok=True); return p

          # ---------------------------------------------------------------- noise
          _perm = rng.permutation(4096)
          def hash3(ix, iy, iz):
              h = (ix * 73856093) ^ (iy * 19349663) ^ (iz * 83492791)
              return (_perm[np.abs(h) % 4096] / 4095.0)

          def vnoise3(p):
              x, y, z = p[..., 0], p[..., 1], p[..., 2]
              xi, yi, zi = np.floor(x).astype(np.int64), np.floor(y).astype(np.int64), np.floor(z).astype(np.int64)
              xf, yf, zf = x - xi, y - yi, z - zi
              s = lambda t: t * t * (3 - 2 * t)
              u, v, w = s(xf), s(yf), s(zf)
              out = 0
              for dx in (0, 1):
                  for dy in (0, 1):
                      for dz in (0, 1):
                          wgt = (u if dx else 1 - u) * (v if dy else 1 - v) * (w if dz else 1 - w)
                          out = out + wgt * hash3(xi + dx, yi + dy, zi + dz)
              return out

          def fbm3(p, octaves=5):
              a, f, tot, norm = 1.0, 1.0, 0, 0
              for _ in range(octaves):
                  tot = tot + a * vnoise3(p * f); norm += a; a *= .5; f *= 2.03
              return tot / norm

          # ---------------------------------------------------------------- cube faces
          FACES = {  # name: (forward, right, up)
              "north": ((0, 0, -1), (1, 0, 0), (0, 1, 0)),
              "east":  ((1, 0, 0), (0, 0, 1), (0, 1, 0)),
              "south": ((0, 0, 1), (-1, 0, 0), (0, 1, 0)),
              "west":  ((-1, 0, 0), (0, 0, -1), (0, 1, 0)),
              "top":   ((0, 1, 0), (1, 0, 0), (0, 0, 1)),
              "bottom": ((0, -1, 0), (1, 0, 0), (0, 0, -1)),
          }

          def face_dirs(face, n):
              f, r, u = (np.array(v, float) for v in FACES[face])
              t = (np.arange(n) + .5) / n * 2 - 1
              uu, vv = np.meshgrid(t, -t)
              d = f + uu[..., None] * r + vv[..., None] * u
              return d / np.linalg.norm(d, axis=-1, keepdims=True)

          def lerp(a, b, t): return a + (b - a) * t
          def C(*h): return np.array([int(h[0][i:i+2], 16) / 255 for i in (1, 3, 5)])

          def gradient(el, stops):
              """stops: list of (elevation, color) sorted ascending."""
              out = np.zeros(el.shape + (3,))
              els = [s[0] for s in stops]
              for ch in range(3):
                  out[..., ch] = np.interp(el, els, [s[1][ch] for s in stops])
              return out

          def stars(d, density=0.9985, scale=180):
              p = d * scale
              cell = np.floor(p)
              h = hash3(cell[..., 0].astype(np.int64), cell[..., 1].astype(np.int64), cell[..., 2].astype(np.int64))
              frac = p - cell - .5
              dist = np.linalg.norm(frac, axis=-1)
              bright = np.clip((h - density) / (1 - density), 0, 1)
              return bright * np.exp(-(dist / .18) ** 2) * 1.6

          # ---------------------------------------------------------------- sky themes
          def sky_day(d):
              el = np.degrees(np.arcsin(np.clip(d[..., 1], -1, 1)))
              col = gradient(el, [(-90, C("#5d7fb8")), (-5, C("#9cc3ec")), (0, C("#d9ecff")), (8, C("#a9d2fa")),
                                  (35, C("#5fa3ec")), (90, C("#2f6fd0"))])
              up = np.clip(d[..., 1], 0.02, 1)
              proj = np.stack([d[..., 0] / up, np.zeros_like(up), d[..., 2] / up], -1) * 1.6
              cl = fbm3(proj + np.array([0, 3.1, 0]), 6)
              cmask = np.clip((cl - .52) * 4.0, 0, 1) * np.clip((el - 2) / 12, 0, 1)
              shade = np.clip(fbm3(proj * 2.1 + 7, 3), 0, 1)
              ccol = lerp(C("#ffffff"), C("#c7d5ea"), shade[..., None] * .8)
              col = lerp(col, ccol, cmask[..., None] * .92)
              return col

          def sky_sunset(d):
              el = np.degrees(np.arcsin(np.clip(d[..., 1], -1, 1)))
              az = np.arctan2(d[..., 0], -d[..., 2])  # 0 = north
              west = np.clip(np.cos(az + np.pi / 2), 0, 1)  # glow toward -x (west)
              col = gradient(el, [(-90, C("#2a1838")), (-3, C("#ff8a4c")), (0, C("#ffc46b")), (6, C("#ff7a59")),
                                  (18, C("#d24f7c")), (40, C("#6a3b8f")), (90, C("#22225a"))])
              glow = west[..., None] ** 3 * np.exp(-np.clip(el, 0, None) / 14)[..., None]
              col = col + glow * C("#ffb347") * .6
              up = np.clip(d[..., 1], 0.03, 1)
              proj = np.stack([d[..., 0] / up, np.zeros_like(up), d[..., 2] / up], -1) * 1.1
              cl = fbm3(proj * np.array([1, 1, 3.5]) + 11, 6)
              cmask = np.clip((cl - .55) * 3.5, 0, 1) * np.clip((el - 1) / 10, 0, 1) * np.clip(1 - el / 70, 0, 1)
              ccol = lerp(C("#ff9e7a"), C("#5b2c6f"), np.clip(el / 40, 0, 1)[..., None])
              ccol = ccol + west[..., None] * C("#ffcf80") * .5
              col = lerp(col, ccol, cmask[..., None] * .85)
              col = col + stars(d, .9993)[..., None] * np.clip((el - 30) / 40, 0, 1)[..., None] * .6
              return col

          def sky_night(d):
              el = np.degrees(np.arcsin(np.clip(d[..., 1], -1, 1)))
              col = gradient(el, [(-90, C("#03040a")), (0, C("#101a33")), (10, C("#0a1226")), (90, C("#04060f"))])
              # milky way band
              n = np.array([0.35, 0.55, 0.76]); n /= np.linalg.norm(n)
              band = np.exp(-(np.abs((d * n).sum(-1)) / .16) ** 2)
              mw = fbm3(d * 6 + 5, 6)
              col = col + band[..., None] * (mw ** 2)[..., None] * C("#8f8fc9") * .55
              col = col + stars(d, .997, 220)[..., None] * C("#ffffff")
              col = col + stars(d, .9992, 90)[..., None] * C("#cfe0ff") * 1.2
              col = col + band[..., None] * stars(d, .985, 400)[..., None] * .5
              # aurora curtains
              az = np.arctan2(d[..., 0], -d[..., 2])
              wav = np.sin(az * 3 + 1.3 * np.sin(az * 7)) * 6 + fbm3(d * 3, 3) * 10
              center = 32 + wav
              height = np.clip(1 - np.abs(el - center) / 18, 0, 1) ** 1.5
              rays = fbm3(np.stack([az * 40, np.zeros_like(az), np.zeros_like(az)], -1), 4)
              rays = 0.45 + 0.9 * rays ** 2
              hue_t = np.clip((el - center + 18) / 36, 0, 1)[..., None]
              acol = lerp(C("#21ff9b"), C("#b04dff"), hue_t ** 1.4)
              north = np.clip(-d[..., 2] * .6 + .7, 0, 1)
              col = col + acol * (height * rays * north)[..., None] * .75
              return col

          def sky_end(d):
              el = np.degrees(np.arcsin(np.clip(d[..., 1], -1, 1)))
              col = gradient(el, [(-90, C("#07020f")), (0, C("#1c0b33")), (90, C("#0a0418"))])
              neb = fbm3(d * 2.5 + 21, 6)
              neb2 = fbm3(d * 4 + 3, 5)
              col = col + (np.clip(neb - .45, 0, 1) * 2.2)[..., None] * C("#9b3dff") * .7
              col = col + (np.clip(neb2 - .55, 0, 1) * 2.5)[..., None] * C("#2bd6c4") * .45
              col = col + stars(d, .996, 200)[..., None] * C("#f1e6ff")
              return col

          THEMES = {"day": sky_day, "sunset": sky_sunset, "night": sky_night, "end": sky_end}

          def to_img(col, alpha=None):
              col = np.clip(col, 0, 1)
              arr = (col * 255 + rng.random(col.shape) * .9).astype(np.uint8)  # dither vs banding
              if alpha is not None:
                  a = (np.clip(alpha, 0, 1) * 255).astype(np.uint8)
                  return Image.fromarray(np.dstack([arr, a]), "RGBA")
              return Image.fromarray(arr, "RGB")

          def render_faces(fn, n):
              return {f: to_img(fn(face_dirs(f, n))) for f in FACES}

          # ---------------------------------------------------------------- landscape for panorama
          def with_landscape(fn, d):
              col = fn(d)
              el = np.degrees(np.arcsin(np.clip(d[..., 1], -1, 1)))
              az = np.arctan2(d[..., 0], -d[..., 2])
              ring = np.stack([np.cos(az), np.zeros_like(az), np.sin(az)], -1)
              far = 2 + fbm3(ring * 2.2 + 40, 5) * 12
              near = -1 + fbm3(ring * 5 + 90, 5) * 8
              tex = fbm3(d * 30, 3)
              farcol = lerp(C("#2d3f5c"), C("#1e2a40"), tex[..., None])
              nearcol = lerp(C("#11331f"), C("#0b2216"), tex[..., None])
              m1 = np.clip((far - el) * 2, 0, 1)[..., None]
              col = lerp(col, lerp(col, farcol, .85), m1)
              m2 = np.clip((near - el) * 2, 0, 1)[..., None]
              col = lerp(col, nearcol, m2)
              return col

          # ---------------------------------------------------------------- write helpers
          def save_json(path, obj): json.dump(obj, open(mk(path), "w"), indent=2)

          def build_textures():
              print("skies...")
              N = 512
              sky_meta = {
                  #  name   fade-in start,end   fade-out start,end  (ticks)  blend
                  "day":    (23500, 0, 11500, 12500),
                  "sunset": (11000, 12000, 13500, 14000),
                  "night":  (13000, 14000, 22500, 23500),
              }
              order = ["bottom", "top", "south", "west", "north", "east"]  # OptiFine 3x2 layout
              for i, name in enumerate(["day", "sunset", "night", "end"], 1):
                  faces = render_faces(THEMES[name], N)
                  # FabricSkyboxes (per-face textures)
                  for f, im in faces.items():
                      im.save(mk(f"{PACK}/assets/{NS}/textures/sky/{name}/{f}.png"))
                  # OptiFine combined cubemap
                  sheet = Image.new("RGB", (N * 3, N * 2))
                  for k, f in enumerate(order):
                      sheet.paste(faces[f], ((k % 3) * N, (k // 3) * N))
                  world = "world1" if name == "end" else "world0"
                  idx = 1 if name == "end" else i
                  sheet.save(mk(f"{PACK}/assets/minecraft/optifine/sky/{world}/sky{idx}.png"))
                  if name == "end":
                      props = {"source": f"./sky{idx}.png", "blend": "replace", "rotate": "true", "speed": "0.2", "axis": "0.0 1.0 0.0"}
                      fsb_fade = {"alwaysOn": True}
                      worlds = ["minecraft:the_end"]
                  else:
                      fi0, fi1, fo0, fo1 = sky_meta[name]
                      hh = lambda t: f"{int((t / 1000 + 6) % 24):02d}:{int((t % 1000) * .06):02d}"
                      props = {"source": f"./sky{idx}.png", "startFadeIn": hh(fi0), "endFadeIn": hh(fi1),
                               "startFadeOut": hh(fo0), "endFadeOut": hh(fo1), "blend": "alpha",
                               "rotate": "true" if name == "night" else "false", "speed": "1.0", "axis": "0.0 0.0 1.0",
                               "weather": "clear"}
                      fsb_fade = {"startFadeIn": fi0, "endFadeIn": fi1, "startFadeOut": fo0, "endFadeOut": fo1}
                      worlds = ["minecraft:overworld"]
                  with open(mk(f"{PACK}/assets/minecraft/optifine/sky/{world}/sky{idx}.properties"), "w") as fh:
                      fh.write(f"# Aurora Skies - {name}\n" + "".join(f"{k}={v}\n" for k, v in props.items()))
                  save_json(f"{PACK}/assets/fabricskyboxes/sky/{NS}_{i}_{name}.json", {
