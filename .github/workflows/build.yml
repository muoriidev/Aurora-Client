                  }).dimensions(lx, y, bw, bh).build());
                  addDrawableChild(ButtonWidget.builder(onOff("CPS anzeigen", c.showCps), b -> {
                      c.showCps = !c.showCps; b.setMessage(onOff("CPS anzeigen", c.showCps));
                  }).dimensions(rx, y, bw, bh).build());
                  y += step;
                  addDrawableChild(ButtonWidget.builder(value("Position", CORNERS[c.hudCorner]), b -> {
                      c.hudCorner = (c.hudCorner + 1) % 4; b.setMessage(value("Position", CORNERS[c.hudCorner]));
                  }).dimensions(lx, y, bw, bh).build());
                  addDrawableChild(new ValueSlider(rx, y, bw, bh, 0.5, 2.0, c.hudScale,
