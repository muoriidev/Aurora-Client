                  }).dimensions(lx, y, bw, bh).build());
                  addDrawableChild(new ValueSlider(rx, y, bw, bh, 0.0, 1.0, c.keyVolume,
                          v -> c.keyVolume = (float) v, v -> value("Lautstärke", Math.round(v * 100) + "%")));

                  // --- Cursor-Glow
                  y += step;
                  addDrawableChild(ButtonWidget.builder(onOff("Cursor-Glow", c.cursorGlow), b -> {
                      c.cursorGlow = !c.cursorGlow; b.setMessage(onOff("Cursor-Glow", c.cursorGlow));
