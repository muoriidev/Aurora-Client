                      mk(f"{PACK}/assets/minecraft/textures/gui/title/background/panorama_{k}.png"))

              print("sun/moon/clouds/icon...")
              S = 128
              yy, xx = np.mgrid[0:S, 0:S]; r = np.hypot(xx - S / 2 + .5, yy - S / 2 + .5) / (S / 2)
              core = np.clip(1 - r / .42, 0, 1) ** .4
              halo = np.exp(-(r / .55) ** 2) * .9
              sun = np.zeros((S, S, 4)); sun[..., :3] = C("#fff3c4"); sun[..., 3] = np.clip(core + halo * .6, 0, 1)
              sun[..., 0:3] = lerp(C("#ffb347")[None, None], C("#fffbe8")[None, None], core[..., None])
              Image.fromarray((sun * 255).astype(np.uint8), "RGBA").save(mk(f"{PACK}/assets/minecraft/textures/environment/sun.png"))

              moon = Image.new("RGBA", (S * 4, S * 2))
              base_r = .5
              mtex = fbm3(np.stack([xx / 18, yy / 18, np.zeros_like(xx) + 3.3], -1), 5)
              for ph in range(8):
                  disc = r < base_r * 1.0 / .5 * .5 / 1  # radius .5 of half -> quarter size
                  disc = np.clip((0.5 - r) * 40, 0, 1)
                  shade = lerp(C("#9aa3b8"), C("#eef1ff"), mtex[..., None])
                  frac = [1, .75, .5, .25, 0, -.25, -.5, -.75][ph]  # full -> new -> full
                  nx = (xx - S / 2 + .5) / (S * .25)
                  lit = np.ones_like(nx)
                  k = np.cos(np.pi * (ph / 8.0) * 2)  # terminator position
                  side = 1 if ph < 4 else -1
                  ny = (yy - S / 2 + .5) / (S * .25)
                  edge = np.sqrt(np.clip(1 - ny ** 2, 0, 1))
                  term = edge * k
                  lit = np.clip((side * nx - (-term)) * 6, 0, 1) if ph != 0 else lit
                  if ph == 4: lit = np.zeros_like(nx) + .04
                  a = disc * np.clip(lit + .06, 0, 1)
                  img = np.dstack([shade, a])
                  glow = np.exp(-((r - .5).clip(0)) / .06) * (r >= .5) * .25 * (ph != 4)
                  img[..., 3] = np.clip(img[..., 3] + glow, 0, 1)
                  moon.paste(Image.fromarray((img * 255).astype(np.uint8), "RGBA"), ((ph % 4) * S, (ph // 4) * S))
              moon.save(mk(f"{PACK}/assets/minecraft/textures/environment/moon_phases.png"))

              cl = fbm3(np.stack([*np.mgrid[0:256, 0:256] / 22.0, np.zeros((256, 256)) + 9], -1), 4)
              cm = (cl > .55).astype(np.uint8) * 255
              cimg = np.dstack([np.full((256, 256, 3), 255, np.uint8), cm])
              Image.fromarray(cimg, "RGBA").save(mk(f"{PACK}/assets/minecraft/textures/environment/clouds.png"))

              icon = to_img(sky_night(face_dirs("north", 256) * np.array([1, 1, 1]) + np.array([0, .55, 0]) / 1))
              icon = to_img(with_landscape(sky_night, (lambda d: d / np.linalg.norm(d, axis=-1, keepdims=True))(
                  face_dirs("north", 256) + np.array([0, .45, 0]))))
              icon.save(f"{PACK}/pack.png"); icon.resize((512, 512), Image.LANCZOS).save(mk(f"{OUT}/previews/icon.png"))

          # ---------------------------------------------------------------- audio
          SR = 44100
          def env(n, a=.002, d=.2):
              t = np.arange(n) / SR
              return np.minimum(t / a, 1) * np.exp(-t / d)

          def tone(freq, dur, a=.002, d=.2, harm=((1, 1), (2, .25), (3, .08)), det=0):
              n = int(dur * SR); t = np.arange(n) / SR
              s = sum(amp * np.sin(2 * np.pi * freq * h * t * (1 + det)) for h, amp in harm)
              return s * env(n, a, d)

          def reverb(x, wet=.25, length=1.2):
              n = int(length * SR)
              ir = rng.standard_normal(n) * np.exp(-np.arange(n) / SR / (length / 5))
              ir[0] = 0
              y = np.convolve(x, ir)[: len(x) + n] if len(x) < 20000 else __import__("scipy.signal", fromlist=["fftconvolve"]).fftconvolve(x, ir)
              y = y / (np.abs(y).max() + 1e-9) * np.abs(x).max()
              out = np.zeros(len(y)); out[:len(x)] += x * (1 - wet)
              return out + y * wet

          def place(buf, sig, at):
              i = int(at * SR); buf[i:i + len(sig)] += sig[: len(buf) - i]

          def note(n): return 440 * 2 ** ((n - 69) / 12)

          def write_ogg(sig, path, stereo=None):
              path = mk(path)
              sig = sig / (np.abs(sig).max() + 1e-9) * .89
              wav = path[:-4] + ".wav"
              data = sig if stereo is None else np.stack([sig, stereo / (np.abs(stereo).max() + 1e-9) * .89], -1)
              with wave.open(wav, "w") as w:
                  w.setnchannels(1 if stereo is None else 2); w.setsampwidth(2); w.setframerate(SR)
                  w.writeframes((data * 32767).astype(np.int16).tobytes())
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", wav, "-c:a", "libvorbis", "-q:a", "6", path], check=True)
              os.remove(wav)

          def build_sounds():
              print("sounds...")
              base = f"{PACK}/assets/{NS}/sounds"
              # click: soft glassy tick
              n = int(.09 * SR)
              click = tone(2093, .09, .0005, .018, ((1, 1), (1.5, .35), (2.76, .2)))
              click[:200] += rng.standard_normal(200) * np.linspace(.5, 0, 200)
              write_ogg(reverb(click, .12, .25), f"{base}/ui/click.ogg")
              # alt click variant
              click2 = tone(1760, .09, .0005, .02, ((1, 1), (1.5, .3), (2.76, .2)))
              write_ogg(reverb(click2, .12, .25), f"{base}/ui/click2.ogg")
              # toast in / out
              b = np.zeros(int(.9 * SR)); place(b, tone(note(88), .6, .003, .25), 0); place(b, tone(note(95), .6, .003, .3), .09)
              write_ogg(reverb(b, .3, 1.0), f"{base}/ui/toast_in.ogg")
              b = np.zeros(int(.9 * SR)); place(b, tone(note(95), .6, .003, .22), 0); place(b, tone(note(88), .6, .003, .28), .09)
              write_ogg(reverb(b, .3, 1.0), f"{base}/ui/toast_out.ogg")
              # challenge complete: shimmering arpeggio
              b = np.zeros(int(3.2 * SR))
              for k, m in enumerate([72, 76, 79, 84, 88, 91, 96]):
                  place(b, tone(note(m), 1.8, .004, .7, ((1, 1), (2, .3), (3, .1), (4, .05))), k * .08)
                  place(b, tone(note(m), 1.8, .004, .7, ((1, .4),), det=.004), k * .08 + .01)
              write_ogg(reverb(b, .4, 2.0), f"{base}/ui/challenge.ogg")
              # level up
              b = np.zeros(int(1.6 * SR))
              for k, m in enumerate([79, 83, 86, 91]):
                  place(b, tone(note(m), .9, .003, .35), k * .07)
              write_ogg(reverb(b, .3, 1.2), f"{base}/ui/levelup.ogg")
              # xp orb pickup: tiny sparkle
              write_ogg(reverb(tone(note(100), .25, .001, .06, ((1, 1), (2, .2))), .2, .4), f"{base}/ui/xp.ogg")

              print("music...")
              dur = 96
              n = int(dur * SR); t = np.arange(n) / SR
              L = np.zeros(n); R = np.zeros(n)
              prog = [[57, 64, 69, 72, 76], [53, 60, 65, 69, 72], [48, 55, 60, 64, 67], [55, 62, 67, 71, 74]]  # Am F C G
              seg = dur / 8
              for s in range(8):
                  chord = prog[s % 4]; st = s * seg
                  m = int((seg + 4) * SR); tt = np.arange(m) / SR
                  envp = np.clip(tt / 3.5, 0, 1) * np.clip((seg + 4 - tt) / 4, 0, 1)
                  for j, nn in enumerate(chord):
                      f = note(nn)
                      pad = sum(np.sin(2 * np.pi * f * (1 + dt) * tt + j) for dt in (-.003, 0, .003)) / 3
                      pad += .2 * np.sin(2 * np.pi * f * 2 * tt)
                      pan = (j / (len(chord) - 1))
                      i0 = int(st * SR); i1 = min(i0 + m, n)
                      L[i0:i1] += (pad * envp * (1 - pan * .6))[: i1 - i0] * .18
                      R[i0:i1] += (pad * envp * (.4 + pan * .6))[: i1 - i0] * .18
                  # sparse bell melody
                  mel_rng = np.random.default_rng(s)
                  for k in range(4):
                      nn = chord[mel_rng.integers(2, 5)] + 12
                      at = st + .8 + k * seg / 4 + mel_rng.random() * .4
                      bell = tone(note(nn), 3.0, .004, .9, ((1, 1), (2.01, .3), (3.0, .1))) * .22
                      i0 = int(at * SR); i1 = min(i0 + len(bell), n)
                      L[i0:i1] += bell[: i1 - i0] * (.7 if k % 2 else 1); R[i0:i1] += bell[: i1 - i0] * (1 if k % 2 else .7)
              fade = np.clip(t / 4, 0, 1) * np.clip((dur - t) / 6, 0, 1)
              from scipy.signal import fftconvolve
              irn = int(3 * SR); irL = rng.standard_normal(irn) * np.exp(-np.arange(irn) / SR / .8); irR = rng.standard_normal(irn) * np.exp(-np.arange(irn) / SR / .8)
              wl = fftconvolve(L, irL)[:n]; wr = fftconvolve(R, irR)[:n]
              wl *= np.abs(L).max() / np.abs(wl).max(); wr *= np.abs(R).max() / np.abs(wr).max()
              write_ogg((L * .65 + wl * .45) * fade, f"{base}/music/aurora_menu.ogg", (R * .65 + wr * .45) * fade)

              s = lambda name, **kw: {"name": f"{NS}:{name}", **kw}
              save_json(f"{PACK}/assets/minecraft/sounds.json", {
                  "ui.button.click": {"replace": True, "sounds": [s("ui/click"), s("ui/click2", weight=1)]},
                  "ui.toast.in": {"replace": True, "sounds": [s("ui/toast_in")]},
                  "ui.toast.out": {"replace": True, "sounds": [s("ui/toast_out")]},
                  "ui.toast.challenge_complete": {"replace": True, "sounds": [s("ui/challenge")]},
                  "entity.player.levelup": {"replace": True, "sounds": [s("ui/levelup")]},
                  "entity.experience_orb.pickup": {"replace": True, "sounds": [s("ui/xp", volume=0.6)]},
                  "music.menu": {"replace": True, "sounds": [s("music/aurora_menu", stream=True)]},
              })

          # ---------------------------------------------------------------- meta / texts
          SPLASHES = """Aurora Skies!
