# =====================================================================
#  Aurora Skies: kompletter Build in EINER Datei
#  Legt den gesamten Mod-Quellcode an, erzeugt alle Himmel, Texturen und
#  Sounds und baut daraus die fertige .jar und die Resource-Packs.
#
#  Benutzung: in ein (privates) GitHub-Repo unter
#      .github/workflows/build.yml
#  legen, dann im Tab "Actions" -> "Build Aurora Skies" -> "Run workflow".
#  Ergebnis: unten im Lauf unter "Artifacts" herunterladen.
# =====================================================================
name: Build Aurora Skies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeuge installieren (numpy, scipy, Pillow, ffmpeg)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install numpy scipy pillow

      - name: Mod-Quellcode anlegen
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'aurora-mod/build.gradle')"
          cat > 'aurora-mod/build.gradle' <<'AURORA_EOF'
          plugins {
              id 'fabric-loom' version '1.10-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/settings.gradle')"
          cat > 'aurora-mod/settings.gradle' <<'AURORA_EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'aurora'
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/gradle.properties')"
          cat > 'aurora-mod/gradle.properties' <<'AURORA_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric - https://fabricmc.net/develop
          minecraft_version=1.21.4
          yarn_mappings=1.21.4+build.8
          loader_version=0.16.14
          fabric_version=0.119.2+1.21.4

          mod_version=1.0.0
          maven_group=dev.aurora
          archives_base_name=aurora-skies
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/LIESMICH.md')"
          cat > 'aurora-mod/LIESMICH.md' <<'AURORA_EOF'
          # Aurora Skies: Fabric-Mod (Minecraft Java 1.21.4)

          ## Features
          | Feature | Beschreibung |
          |---|---|
          | **Aurora-Menü** | **Rechts-Shift** im Spiel oder der Button **✦ Aurora** oben rechts im Haupt- und Pausemenü. Alles per Klick an/aus. |
          | **Himmel** | *Klassik* (Tag mit Wolken, Sonnenuntergang, Nordlicht + Milchstraße, End-Nebel) oder *Deep Space* (Schwarzes Loch mit Akkretionsscheibe + Ringplanet als Nachthimmel) |
          | **UI-Sounds & Musik** | eigener Button-Klick, Toasts, Erfolg, Level-Up, XP, Ambient-Menümusik |
          | **Extras** | eigenes Titel-Panorama, Sonne, Mondphasen, Wolken, Splash-Texte |
          | **Keystrokes-HUD** | zeigt live W/A/S/D (deine echte Belegung), LMB/RMB mit CPS und Leertaste. Animiert, in Akzentfarbe, 4 Positionen, Größe 50–200 % |
          | **Tastatur-Sounds** | Profile *Creamy*, *Thocky*, *Clacky*, *Eigene*: Anschlag + leiser Upstroke, tiefer Sound für Leertaste/Enter/Shift, Lautstärke-Regler, wahlweise nur beim Tippen oder auch im Spiel |
          | **Cursor-Glow** | weicher Leuchtschein am Mauszeiger in allen Menüs, Nachzieh-Spur, Puls beim Klicken, 6 Farben, Größe einstellbar |

          Die Einstellungen werden in `.minecraft/config/aurora.json` gespeichert.

          ## Himmel brauchen FabricSkyboxes
          Sounds, HUD, Glow, Menü, Panorama, Sonne und Mond laufen allein. Für die Himmel muss zusätzlich
          **FabricSkyboxes** (Modrinth) installiert sein.

          ## Mod bauen (einmalig ca. 10 Minuten)
          1. **JDK 21** installieren (z. B. Adoptium Temurin 21).
          2. **IntelliJ IDEA Community** installieren, Ordner `aurora-mod` öffnen und warten, bis Gradle fertig ist.
             (IntelliJ lädt Gradle 8.12 automatisch über `gradle/wrapper/gradle-wrapper.properties`.)
          3. Rechts im Gradle-Fenster `Tasks > build > build` doppelklicken.
          4. Die fertige Mod liegt danach in `build/libs/aurora-skies-1.0.0.jar`. Diese Datei in `.minecraft/mods` kopieren,
             zusammen mit **Fabric API** und **FabricSkyboxes**.

          Testen ohne eigenes Minecraft: `Tasks > fabric > runClient`.

          Falls beim Bauen Versionsfehler kommen: die aktuellen Nummern für 1.21.4 stehen auf https://fabricmc.net/develop
          (Werte in `gradle.properties` eintragen).

          ## Eigene Sounds / eigene Himmel
          - **Tastatur:** Ein Resource-Pack mit `assets/aurora/sounds.json`, das `key.custom.press`, `key.custom.release` und
            `key.custom.big` ersetzt, und im Menü das Profil „Eigene“ wählen.
          - **Himmel:** Die PNGs in `src/main/resources/resourcepacks/aurora_skies/assets/aurora/textures/sky/<stil>/`
            (6 Seiten: north/east/south/west/top/bottom) austauschen. Für OptiFine die 3×2-Kachel in `optifine/sky/`.
            Bei fremden Bildern nur solche nutzen, die du kommerziell verwenden darfst.

          ## Projektstruktur
          ```
          src/main/java/dev/aurora/
            AuroraClient.java      Einstieg: Packs, Tastenbelegung, HUD, Glow, Menü-Button
            AuroraConfig.java      Einstellungen (JSON)
            KeySounds.java         Tastatur-Sounds
            KeystrokesHud.java     Tastenanzeige + CPS
            CursorGlow.java        Mauszeiger-Glow
            Palette.java           Farben
            gui/AuroraConfigScreen.java, gui/ValueSlider.java
            mixin/KeyboardMixin.java, mixin/MouseMixin.java
          src/main/resources/
            resourcepacks/aurora_skies      Basis-Pack (Himmel Klassik, UI-Sounds, Musik, …)
            resourcepacks/aurora_deepspace  Deep-Space-Himmel + Panorama
            assets/aurora/sounds            Tastatur-Sounds (selbst erzeugt)
          ```
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/LIZENZ.txt')"
          cat > 'aurora-mod/LIZENZ.txt' <<'AURORA_EOF'
          Aurora Skies - Lizenz
          =====================

          Copyright (c) 2026 [DEIN NAME / STUDIO]. Alle Rechte vorbehalten.

          Alle Texturen, Skyboxen, Sounds und die Musik in diesem Paket sind Originalwerke
          und enthalten keine Dateien aus Minecraft.

          Du darfst:
            - das Paket privat nutzen, auch auf Servern und in Videos/Streams.

          Du darfst NICHT:
            - das Paket oder Teile davon weiterverbreiten, neu hochladen oder weiterverkaufen,
            - Dateien daraus in eigene Packs oder Mods übernehmen.

          NICHT OFFIZIELLES MINECRAFT-PRODUKT. NICHT VON MOJANG ODER MICROSOFT GENEHMIGT
          ODER MIT IHNEN VERBUNDEN.
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/resources/fabric.mod.json')"
          cat > 'aurora-mod/src/main/resources/fabric.mod.json' <<'AURORA_EOF'
          {
            "schemaVersion": 1,
            "id": "aurora",
            "version": "${version}",
            "name": "Aurora Skies",
            "description": "Custom Skies, UI-Sounds, Keystrokes-HUD, cremige Tastatur-Sounds und Cursor-Glow. Menü: Rechte Shift-Taste.",
            "authors": ["DEIN NAME"],
            "license": "All-Rights-Reserved",
            "icon": "assets/aurora/icon.png",
            "environment": "client",
            "entrypoints": { "client": ["dev.aurora.AuroraClient"] },
            "mixins": ["aurora.mixins.json"],
            "depends": { "fabricloader": ">=0.16.0", "minecraft": "~1.21.4", "java": ">=21", "fabric-api": "*" },
            "suggests": { "fabricskyboxes": "*" }
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/resources/aurora.mixins.json')"
          cat > 'aurora-mod/src/main/resources/aurora.mixins.json' <<'AURORA_EOF'
          {
            "required": true,
            "package": "dev.aurora.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["KeyboardMixin", "MouseMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/resources/assets/aurora/lang/de_de.json')"
          cat > 'aurora-mod/src/main/resources/assets/aurora/lang/de_de.json' <<'AURORA_EOF'
          {
            "key.categories.aurora": "Aurora Skies",
            "key.aurora.menu": "Aurora-Menü öffnen",
            "subtitles.aurora.key": "Tastenanschlag"
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/resources/assets/aurora/lang/en_us.json')"
          cat > 'aurora-mod/src/main/resources/assets/aurora/lang/en_us.json' <<'AURORA_EOF'
          {
            "key.categories.aurora": "Aurora Skies",
            "key.aurora.menu": "Open Aurora menu",
            "subtitles.aurora.key": "Key press"
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/java/dev/aurora/AuroraClient.java')"
          cat > 'aurora-mod/src/main/java/dev/aurora/AuroraClient.java' <<'AURORA_EOF'
          package dev.aurora;

          import dev.aurora.gui.AuroraConfigScreen;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.Screens;
          import net.fabricmc.fabric.api.resource.ResourceManagerHelper;
          import net.fabricmc.fabric.api.resource.ResourcePackActivationType;
          import net.fabricmc.loader.api.FabricLoader;
          import net.fabricmc.loader.api.ModContainer;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.GameMenuScreen;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.resource.ResourcePackManager;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class AuroraClient implements ClientModInitializer {
              public static final String MOD_ID = "aurora";
              public static final Logger LOG = LoggerFactory.getLogger("Aurora");
              private static KeyBinding menuKey;

              @Override
              public void onInitializeClient() {
                  AuroraConfig.load();

                  // Eingebaute Packs: Basis (Himmel Klassik, UI-Sounds, Musik, Panorama, Sonne/Mond) + Deep-Space-Himmel
                  ModContainer mod = FabricLoader.getInstance().getModContainer(MOD_ID).orElseThrow();
                  ResourceManagerHelper.registerBuiltinResourcePack(Identifier.of(MOD_ID, "aurora_skies"), mod,
                          Text.literal("Aurora Skies"), ResourcePackActivationType.DEFAULT_ENABLED);
                  ResourceManagerHelper.registerBuiltinResourcePack(Identifier.of(MOD_ID, "aurora_deepspace"), mod,
                          Text.literal("Aurora Skies: Deep Space"), ResourcePackActivationType.NORMAL);

                  menuKey = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.aurora.menu",
                          InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT, "key.categories.aurora"));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (menuKey.wasPressed()) client.setScreen(new AuroraConfigScreen(client.currentScreen));
                  });

                  HudRenderCallback.EVENT.register(KeystrokesHud::render);

                  ScreenEvents.AFTER_INIT.register((client, screen, w, h) -> {
                      // Aurora-Button im Hauptmenü und Pausemenü
                      if (screen instanceof TitleScreen || screen instanceof GameMenuScreen) {
                          Screens.getButtons(screen).add(ButtonWidget.builder(Text.literal("✦ Aurora"),
                                          b -> client.setScreen(new AuroraConfigScreen(screen)))
                                  .dimensions(w - 86, 6, 80, 20).build());
                      }
                      ScreenEvents.afterRender(screen).register((s, ctx, mx, my, delta) -> CursorGlow.render(ctx, mx, my, delta));
                  });

                  ClientLifecycleEvents.CLIENT_STARTED.register(client -> applyPacks());
              }

              /** Schaltet die eingebauten Packs passend zur Config an/aus und lädt Ressourcen neu, falls nötig. */
              public static void applyPacks() {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  ResourcePackManager m = mc.getResourcePackManager();
                  AuroraConfig c = AuroraConfig.INSTANCE;
                  boolean changed = false;
                  for (String id : m.getIds()) {
                      boolean want;
                      if (id.contains("aurora_deepspace")) want = c.skyPack && c.skyStyle == 1;
                      else if (id.contains("aurora_skies")) want = c.skyPack;
                      else continue;
                      boolean on = m.getEnabledIds().contains(id);
                      if (want && !on) changed |= m.enable(id);
                      if (!want && on) changed |= m.disable(id);
                  }
                  if (changed) mc.options.refreshResourcePacks(m);
              }
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/java/dev/aurora/AuroraConfig.java')"
          cat > 'aurora-mod/src/main/java/dev/aurora/AuroraConfig.java' <<'AURORA_EOF'
          package dev.aurora;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;

          /** Alle Einstellungen, gespeichert in .minecraft/config/aurora.json */
          public class AuroraConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path FILE = FabricLoader.getInstance().getConfigDir().resolve("aurora.json");
              public static AuroraConfig INSTANCE = new AuroraConfig();

              // Himmel + UI-Sounds (eingebautes Resource-Pack)
              public boolean skyPack = true;
              public int skyStyle = 1;         // 0 = Klassik (Nordlicht), 1 = Deep Space (Schwarzes Loch)

              // Keystrokes
              public boolean keystrokes = true;
              public boolean showCps = true;
              public int hudCorner = 0;        // 0 oben links, 1 oben rechts, 2 unten links, 3 unten rechts
              public float hudScale = 1.0f;

              // Tastatur-Sounds
              public boolean keySounds = true;
              public boolean keySoundsInGame = true; // auch beim Spielen (WASD usw.), nicht nur beim Tippen
              public int keyProfile = 0;            // Index in KeySounds.PROFILES
              public float keyVolume = 0.6f;

              // Cursor-Glow + Akzentfarbe
              public boolean cursorGlow = true;
              public boolean cursorTrail = true;
              public int color = 0;                 // Index in Palette.COLORS
              public int glowSize = 56;

              public static void load() {
                  try {
                      if (Files.exists(FILE)) try (Reader r = Files.newBufferedReader(FILE)) {
                          AuroraConfig c = GSON.fromJson(r, AuroraConfig.class);
                          if (c != null) INSTANCE = c;
                      }
                  } catch (Exception e) {
                      AuroraClient.LOG.warn("Aurora: Config konnte nicht geladen werden, nutze Standardwerte", e);
                  }
                  INSTANCE.color = Math.floorMod(INSTANCE.color, Palette.COLORS.length);
                  INSTANCE.skyStyle = Math.floorMod(INSTANCE.skyStyle, 2);
                  INSTANCE.keyProfile = Math.floorMod(INSTANCE.keyProfile, KeySounds.PROFILES.length);
              }

              public static void save() {
                  try (Writer w = Files.newBufferedWriter(FILE)) {
                      GSON.toJson(INSTANCE, w);
                  } catch (Exception e) {
                      AuroraClient.LOG.warn("Aurora: Config konnte nicht gespeichert werden", e);
                  }
              }

              public int rgb() { return Palette.COLORS[color].rgb(); }
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/java/dev/aurora/CursorGlow.java')"
          cat > 'aurora-mod/src/main/java/dev/aurora/CursorGlow.java' <<'AURORA_EOF'
          package dev.aurora;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderLayer;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.Util;

          /** Weicher Leucht-Effekt am Mauszeiger in allen Menüs, mit Nachzieh-Spur und Klick-Puls. */
          public final class CursorGlow {
              private static final Identifier GLOW = Identifier.of(AuroraClient.MOD_ID, "textures/gui/glow.png");
              private static final int TRAIL = 8;
              private static final float[] TX = new float[TRAIL], TY = new float[TRAIL];
              private static float gx, gy, pulse;
              private static boolean initialised;
              private static long lastFrame = Util.getMeasuringTimeMs();

              public static void onClick() { pulse = 1f; }

              public static void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  AuroraConfig cfg = AuroraConfig.INSTANCE;
                  if (!cfg.cursorGlow) return;
                  if (!initialised) {
                      gx = mouseX; gy = mouseY;
                      for (int i = 0; i < TRAIL; i++) { TX[i] = mouseX; TY[i] = mouseY; }
                      initialised = true;
                  }
                  long now = Util.getMeasuringTimeMs();
                  float dt = Math.min(100, now - lastFrame) / 1000f;
                  lastFrame = now;
                  float follow = 1f - (float) Math.exp(-dt * 35f);   // bildratenunabhängig
                  float trail = 1f - (float) Math.exp(-dt * 40f);
                  gx += (mouseX - gx) * follow;
                  gy += (mouseY - gy) * follow;
                  for (int i = TRAIL - 1; i > 0; i--) {
                      TX[i] += (TX[i - 1] - TX[i]) * trail;
                      TY[i] += (TY[i - 1] - TY[i]) * trail;
                  }
                  TX[0] = gx; TY[0] = gy;
                  pulse = Math.max(0f, pulse - dt * 3f);              // Klick-Puls ca. 0,33 s

                  int rgb = cfg.rgb();
                  ctx.getMatrices().push();
                  ctx.getMatrices().translate(0, 0, 500); // über allen Widgets

                  if (cfg.cursorTrail) {
                      for (int i = TRAIL - 1; i >= 1; i--) {
                          float f = 1f - i / (float) TRAIL;
                          blob(ctx, TX[i], TY[i], cfg.glowSize * 0.45f * f, (int) (70 * f), rgb);
                      }
                  }
                  float size = cfg.glowSize * (1f + pulse * 0.7f);
                  blob(ctx, gx, gy, size, (int) (120 + 80 * pulse), rgb);        // großer Schein
                  blob(ctx, mouseX, mouseY, size * 0.28f, 200, 0xFFFFFF);        // heller Kern
                  ctx.getMatrices().pop();
              }

              private static void blob(DrawContext ctx, float cx, float cy, float size, int alpha, int rgb) {
                  int s = Math.max(2, Math.round(size));
                  ctx.drawTexture(RenderLayer::getGuiTextured, GLOW, Math.round(cx - s / 2f), Math.round(cy - s / 2f),
                          0f, 0f, s, s, s, s, Palette.argb(alpha, rgb));
              }

              private CursorGlow() {}
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/java/dev/aurora/KeySounds.java')"
          cat > 'aurora-mod/src/main/java/dev/aurora/KeySounds.java' <<'AURORA_EOF'
          package dev.aurora;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.sound.PositionedSoundInstance;
          import net.minecraft.sound.SoundEvent;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.random.Random;
          import org.lwjgl.glfw.GLFW;

          /** Cremige Tastatur-Sounds. Sounddateien: assets/aurora/sounds/key/<profil>/ */
          public final class KeySounds {
              public static final String[] PROFILES = {"creamy", "thocky", "clacky", "custom"};
              public static final String[] PROFILE_NAMES = {"Creamy", "Thocky", "Clacky", "Eigene"};
              private static final Random RANDOM = Random.create();

              private static SoundEvent event(String profile, String kind) {
                  Identifier id = Identifier.of(AuroraClient.MOD_ID, "key." + profile + "." + kind);
                  return SoundEvent.of(id); // nur clientseitig, keine Registrierung nötig
              }

              private static boolean isBig(int key) {
                  return key == GLFW.GLFW_KEY_SPACE || key == GLFW.GLFW_KEY_ENTER || key == GLFW.GLFW_KEY_KP_ENTER
                          || key == GLFW.GLFW_KEY_BACKSPACE || key == GLFW.GLFW_KEY_LEFT_SHIFT
                          || key == GLFW.GLFW_KEY_RIGHT_SHIFT || key == GLFW.GLFW_KEY_TAB;
              }

              /** action: 1 = gedrückt, 0 = losgelassen, 2 = gehalten (Wiederholung) */
              public static void onKey(int key, int action) {
                  AuroraConfig cfg = AuroraConfig.INSTANCE;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (!cfg.keySounds || key == GLFW.GLFW_KEY_UNKNOWN) return;
                  boolean typing = mc.currentScreen != null;
                  if (!typing && !cfg.keySoundsInGame) return;
                  if (action == GLFW.GLFW_REPEAT && !typing) return; // im Spiel kein Dauerfeuer

                  String kind = action == GLFW.GLFW_RELEASE ? "release" : isBig(key) ? "big" : "press";
                  float volume = cfg.keyVolume * (action == GLFW.GLFW_REPEAT ? 0.7f : 1f);
                  play(event(PROFILES[cfg.keyProfile], kind), volume);
              }

              public static void preview() {
                  play(event(PROFILES[AuroraConfig.INSTANCE.keyProfile], "press"), AuroraConfig.INSTANCE.keyVolume);
              }

              private static void play(SoundEvent ev, float volume) {
                  if (volume <= 0.01f) return;
                  float pitch = 0.95f + RANDOM.nextFloat() * 0.1f;
                  MinecraftClient.getInstance().getSoundManager().play(PositionedSoundInstance.master(ev, pitch, volume));
              }

              private KeySounds() {}
          }
          AURORA_EOF
          mkdir -p "$(dirname 'aurora-mod/src/main/java/dev/aurora/KeystrokesHud.java')"
          cat > 'aurora-mod/src/main/java/dev/aurora/KeystrokesHud.java' <<'AURORA_EOF'
          package dev.aurora;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.option.GameOptions;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.render.RenderTickCounter;
          import net.minecraft.text.Text;
          import net.minecraft.util.Util;

          import java.util.ArrayDeque;
          import java.util.Deque;

          /** Zeigt live an, welche Tasten gedrückt werden (WASD, Maus mit CPS, Leertaste). */
          public final class KeystrokesHud {
              private static final Deque<Long> LEFT = new ArrayDeque<>();
              private static final Deque<Long> RIGHT = new ArrayDeque<>();
              private static final float[] ANIM = new float[7];
              private static long lastFrame = Util.getMeasuringTimeMs();

              private static final int K = 22, GAP = 2;
              private static final int W = K * 3 + GAP * 2;
              private static final int H = K * 3 + GAP * 3 + 12;

              public static void onClick(int button) {
                  long now = Util.getMeasuringTimeMs();
                  if (button == 0) LEFT.addLast(now);
                  else if (button == 1) RIGHT.addLast(now);
              }

              private static int cps(Deque<Long> q) {
                  long now = Util.getMeasuringTimeMs();
                  while (!q.isEmpty() && now - q.peekFirst() > 1000) q.pollFirst();
                  return q.size();
              }

              public static void render(DrawContext ctx, RenderTickCounter counter) {
                  AuroraConfig cfg = AuroraConfig.INSTANCE;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (!cfg.keystrokes || mc.player == null || mc.options.hudHidden || mc.getDebugHud().shouldShowDebugHud()) return;

                  GameOptions o = mc.options;
                  KeyBinding[] binds = {o.forwardKey, o.leftKey, o.backKey, o.rightKey, o.attackKey, o.useKey, o.jumpKey};
                  long now = Util.getMeasuringTimeMs();
                  float dt = Math.min(100, now - lastFrame) / 1000f; // Sekunden seit letztem Frame
                  lastFrame = now;
                  float speed = 1f - (float) Math.exp(-dt * 25f);       // ca. 40 ms Ein-/Ausblenden
                  for (int i = 0; i < binds.length; i++) {
                      float target = binds[i].isPressed() ? 1f : 0f;
                      ANIM[i] += (target - ANIM[i]) * speed;
                  }

                  float s = cfg.hudScale;
                  int sw = ctx.getScaledWindowWidth(), sh = ctx.getScaledWindowHeight();
                  float x = (cfg.hudCorner % 2 == 0) ? 6 : sw - W * s - 6;
                  float y = (cfg.hudCorner < 2) ? 6 : sh - H * s - 6;

                  ctx.getMatrices().push();
                  ctx.getMatrices().translate(x, y, 0);
                  ctx.getMatrices().scale(s, s, 1f);
                  TextRenderer tr = mc.textRenderer;
                  int accent = cfg.rgb();

                  key(ctx, tr, K + GAP, 0, K, K, label(o.forwardKey), ANIM[0], accent);
                  key(ctx, tr, 0, K + GAP, K, K, label(o.leftKey), ANIM[1], accent);
                  key(ctx, tr, K + GAP, K + GAP, K, K, label(o.backKey), ANIM[2], accent);
                  key(ctx, tr, (K + GAP) * 2, K + GAP, K, K, label(o.rightKey), ANIM[3], accent);

                  int half = (W - GAP) / 2, row = (K + GAP) * 2;
                  String l = cfg.showCps ? cps(LEFT) + " CPS" : "LMB";
                  String r = cfg.showCps ? cps(RIGHT) + " CPS" : "RMB";
                  key(ctx, tr, 0, row, half, K, Text.literal(l), ANIM[4], accent);
                  key(ctx, tr, half + GAP, row, W - half - GAP, K, Text.literal(r), ANIM[5], accent);

                  int sy = row + K + GAP;
                  int bg = Palette.lerp(ANIM[6], 0x90101018, Palette.argb(0xE0, accent));
                  ctx.fill(0, sy, W, sy + 12, bg);
                  int bar = Palette.lerp(ANIM[6], 0xFFBBBBCC, 0xFFFFFFFF);
                  ctx.fill(W / 2 - 14, sy + 5, W / 2 + 14, sy + 7, bar);

                  ctx.getMatrices().pop();
              }

              private static Text label(KeyBinding kb) {
                  String t = kb.getBoundKeyLocalizedText().getString();
                  return Text.literal(t.length() > 3 ? t.substring(0, 3) : t);
              }

              private static void key(DrawContext ctx, TextRenderer tr, int x, int y, int w, int h, Text text, float a, int accent) {
                  int bg = Palette.lerp(a, 0x90101018, Palette.argb(0xE0, accent));
                  ctx.fill(x, y, x + w, y + h, bg);
                  ctx.fill(x, y, x + w, y + 1, Palette.lerp(a, 0x30FFFFFF, 0x90FFFFFF));       // obere Lichtkante
                  ctx.fill(x, y + h - 1, x + w, y + h, Palette.argb(0x60, accent));           // Akzent unten
                  int color = Palette.lerp(a, 0xFFE8E8F0, 0xFFFFFFFF);
                  ctx.drawCenteredTextWithShadow(tr, text, x + w / 2, y + (h - 8) / 2 + 1, color);
              }

              private KeystrokesHud() {}
          }
          AURORA_EOF
