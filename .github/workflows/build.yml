          import net.minecraft.util.Formatting;

          /** Das Aurora-Menü: alle Features per Klick an/aus. Öffnen mit Rechts-Shift oder dem Aurora-Button. */
          public class AuroraConfigScreen extends Screen {
              private static final String[] CORNERS = {"Oben links", "Oben rechts", "Unten links", "Unten rechts"};
              private static final String[] SKY_STYLES = {"Klassik", "Deep Space"};
              private final Screen parent;
              private boolean packDirty;
              private int panelX, panelY, panelW, panelH;

              public AuroraConfigScreen(Screen parent) {
                  super(Text.literal("Aurora Skies"));
                  this.parent = parent;
              }

              private static MutableText onOff(String name, boolean v) {
                  return Text.literal(name + ": ").append(v ? Text.literal("AN").formatted(Formatting.GREEN)
                          : Text.literal("AUS").formatted(Formatting.RED));
              }

              private static MutableText value(String name, String v) {
                  return Text.literal(name + ": ").append(Text.literal(v).formatted(Formatting.AQUA));
              }

              @Override
              protected void init() {
                  AuroraConfig c = AuroraConfig.INSTANCE;
                  int bw = 150, bh = 20, step = 23;
