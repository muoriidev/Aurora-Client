          AURORA_EOF
          mkdir -p "$(dirname 'gen/deepspace.py')"
          cat > 'gen/deepspace.py' <<'AURORA_EOF'
          """Deep Space sky: original procedural black hole + ringed gas giant."""
          import os, shutil, json
          import numpy as np
          from PIL import Image
          import build as B
          from build import fbm3, stars, C, lerp, gradient, face_dirs, to_img, mk

          def norm(v): return v / np.linalg.norm(v)

          BH = norm(np.array([0.15, np.sin(np.radians(28)), -np.cos(np.radians(28))]))
          PL = norm(np.array([-np.cos(np.radians(4)) * np.sin(np.radians(42)), np.sin(np.radians(4)), -np.cos(np.radians(4)) * np.cos(np.radians(42))]))

          def frame(center, roll_deg):
              up = np.array([0, 1, 0.])
              e1 = norm(np.cross(up, -center)) * -1  # horizontal "right" in view
              e1 = norm(np.cross(center, up)) if np.linalg.norm(np.cross(center, up)) > 1e-6 else np.array([1, 0, 0.])
              e2 = np.cross(e1, center)
              r = np.radians(roll_deg)
              return e1 * np.cos(r) + e2 * np.sin(r), -e1 * np.sin(r) + e2 * np.cos(r)

          def gnomonic(d, c, e1, e2):
              cz = (d * c).sum(-1)
              safe = np.where(cz > 0.05, cz, 0.05)
              return (d * e1).sum(-1) / safe, (d * e2).sum(-1) / safe, cz

          def sky_deepspace(d):
              el = np.degrees(np.arcsin(np.clip(d[..., 1], -1, 1)))
              col = gradient(el, [(-90, C("#050508")), (0, C("#1a1c24")), (15, C("#101219")), (90, C("#06070b"))])
              # dust / faint nebula
              neb = fbm3(d * 3 + 50, 6)
              col = col + np.clip(neb - .5, 0, 1)[..., None] * 2 * C("#3a3550") * .5
              col = col + stars(d, .9965, 240)[..., None] * C("#ffffff") * .9
              col = col + stars(d, .9993, 110)[..., None] * C("#dfe8ff") * 1.3

              # ---------- black hole
              e1, e2 = frame(BH, -9)
              px, py, cz = gnomonic(d, BH, e1, e2)
              front = cz > 0
              r = np.hypot(px, py)
              R0 = 0.085
              ang = np.arccos(np.clip(cz, -1, 1))
              col = col + (np.exp(-ang / .55) * .22)[..., None] * C("#aeb4c4")                        # big haze
              halo = np.exp(-np.clip(r - R0, 0, None) / (R0 * 2.8)) * front
              col = col + (halo * .3)[..., None] * C("#e8eeff")
              ring = np.exp(-((r - R0 * 1.06) / (R0 * .035)) ** 2) * front
              col = col + (ring * 1.2)[..., None] * C("#ffffff")
              # lensed far side of the disk (arc around the shadow)
              lens = np.exp(-((r - R0 * 1.3) / (R0 * .12)) ** 2) * front
              streak_l = .6 + .8 * fbm3(np.stack([np.arctan2(py, px) * 30, r * 50, np.zeros_like(r)], -1), 4)
              col = col + (lens * streak_l * .7)[..., None] * C("#ffd6a0")
              # shadow
              shadow = np.clip((R0 - r) / (R0 * .04), 0, 1) * front
              col = col * (1 - shadow[..., None])
              # front disk (thin band crossing in front)
              thick = R0 * (.2 + .07 * np.abs(px) / R0)
              band = np.exp(-(py / thick) ** 2) * front * np.clip((R0 * 9 - np.abs(px)) / (R0 * 4), 0, 1) ** 2
              radial = np.exp(-np.clip(np.abs(px) - R0 * 1.0, 0, None) / (R0 * 3.2))
              streak = fbm3(np.stack([px * 60, py * 700, np.zeros_like(px)], -1), 5)
              dust = .55 + .9 * streak
              doppler = 1 + .45 * np.tanh(-px / R0)
              t = np.clip((np.abs(px) - R0) / (R0 * 5), 0, 1)[..., None]
              dcol = lerp(C("#fff4dc"), lerp(C("#ffad55"), C("#6e4524"), t), np.clip(t * 1.6, 0, 1))
              a = np.clip(band * radial * dust * doppler, 0, 1.4)
              col = lerp(col, dcol * 1.15, np.clip(a * 1.3, 0, 1)[..., None])

              # ---------- ringed gas giant
              f1, f2 = frame(PL, 0)
              qx, qy, qz = gnomonic(d, PL, f1, f2)
              pfront = qz > 0
              Rp = np.tan(np.radians(16))
              rr = np.hypot(qx, qy) / Rp
              disc = (rr < 1) & pfront
              nz = np.sqrt(np.clip(1 - rr ** 2, 0, 1))
              nx, ny = qx / Rp, qy / Rp
              L = np.array([(BH * f1).sum(), (BH * f2).sum(), (BH * PL).sum()]); L = norm(L)
              light = np.clip(nx * L[0] + ny * L[1] + nz * L[2], 0, 1) * .85 + .08
              tilt = np.radians(-18)
              lat = ny * np.cos(tilt) - nx * np.sin(tilt)
              bands = fbm3(np.stack([lat * 9, lat * 2 + nx * .3, np.zeros_like(lat)], -1), 5)
              pcol = lerp(C("#5c5246"), C("#e8dcc4"), np.clip(bands * 1.3 - .1, 0, 1)[..., None])
              pcol = pcol * light[..., None]
              limb = np.clip((1 - rr) * 25, 0, 1)
              col = lerp(col, pcol, (disc * limb)[..., None])
              atmo = np.exp(-np.abs(rr - 1) / .02) * pfront * .35
              col = col + atmo[..., None] * C("#d9d2c2")
              # rings
              u = qx * np.cos(tilt) + qy * np.sin(tilt)
              v = -qx * np.sin(tilt) + qy * np.cos(tilt)
              rho = np.hypot(u, v / .2) / Rp
              rband = (rho > 1.3) & (rho < 2.5) & pfront
              rtex = .45 + .55 * np.sin(rho * 38) ** 2 * fbm3(np.stack([rho * 25, np.zeros_like(rho), np.zeros_like(rho)], -1), 3) * 1.6
              gap = 1 - np.exp(-((rho - 1.95) / .03) ** 2) * .9
              ralpha = rband * np.clip(rtex * gap, 0, 1) * np.clip((rho - 1.3) * 20, 0, 1) * np.clip((2.5 - rho) * 20, 0, 1)
              behind = disc & (v > 0)
              ralpha = ralpha * np.where(behind, 0, 1) * .85
              rcol = C("#efe3cc") * (.55 + .45 * (u > 0))[..., None]
              col = lerp(col, rcol, ralpha[..., None])
              return col

          def landscape_space(d):
              col = sky_deepspace(d)
              el = np.degrees(np.arcsin(np.clip(d[..., 1], -1, 1)))
              az = np.arctan2(d[..., 0], -d[..., 2])
              ringv = np.stack([np.cos(az), np.zeros_like(az), np.sin(az)], -1)
              h = -2 + fbm3(ringv * 4 + 300, 5) * 9
              tex = fbm3(d * 40, 3)
              rock = lerp(C("#2a1420"), C("#4a2233"), tex[..., None])
              return lerp(col, rock, np.clip((h - el) * 2, 0, 1)[..., None])

          if __name__ == "__main__":
              OUT = os.environ.get("AURORA_OUT", "/home/claude/out")
              DS = f"{OUT}/AuroraSkies_DeepSpace"
              shutil.rmtree(DS, ignore_errors=True)
              N = 1024
              order = ["bottom", "top", "south", "west", "north", "east"]
              faces = {f: to_img(sky_deepspace(face_dirs(f, N))) for f in B.FACES}
              for f, im in faces.items():
                  im.save(mk(f"{DS}/assets/aurora/textures/sky/night/{f}.png"))
              sheet = Image.new("RGB", (N * 3, N * 2))
              for k, f in enumerate(order):
                  sheet.paste(faces[f], ((k % 3) * N, (k // 3) * N))
              sheet.save(mk(f"{DS}/assets/minecraft/optifine/sky/world0/sky3.png"))
              for k, f in enumerate(["north", "east", "south", "west", "top", "bottom"]):
                  to_img(landscape_space(face_dirs(f, 1024))).save(
                      mk(f"{DS}/assets/minecraft/textures/gui/title/background/panorama_{k}.png"))
              # preview looking at the black hole
              W, H = 1920, 1080
              x = (np.arange(W) + .5) / W * 2 - 1; y = (np.arange(H) + .5) / H * 2 - 1
              xx, yy = np.meshgrid(x * 1.7, -y * .95 + .55)
              yaw = np.radians(-18)
              dd = np.stack([xx * np.cos(yaw) - np.sin(yaw), yy, -np.cos(yaw) - xx * np.sin(yaw)], -1)
              dd /= np.linalg.norm(dd, axis=-1, keepdims=True)
              to_img(landscape_space(dd)).save(mk(f"{OUT}/previews/5_deepspace.png"))
              icon_d = face_dirs("north", 256) * 1.0
              B.save_json(f"{DS}/pack.mcmeta", {"pack": {
                  "pack_format": 46, "supported_formats": {"min_inclusive": 34, "max_inclusive": 120},
                  "min_format": 34, "max_format": 120,
                  "description": [{"text": "Aurora Skies ", "color": "aqua", "bold": True},
                                  {"text": "Deep Space Add-on", "color": "light_purple"}]}})
              Image.open(f"{OUT}/previews/5_deepspace.png").crop((420, 0, 1500, 1080)).resize((256, 256), Image.LANCZOS).save(f"{DS}/pack.png")
              print("done")
          AURORA_EOF
          mkdir -p "$(dirname 'gen/LIZENZ.txt')"
          cat > 'gen/LIZENZ.txt' <<'AURORA_EOF'
          Aurora Skies - Lizenz
          =====================

          Copyright (c) 2026 [DEIN NAME / STUDIO]. Alle Rechte vorbehalten.

          Alle Texturen, Skyboxen, Sounds und die Musik in diesem Paket sind Originalwerke
          und enthalten keine Dateien aus Minecraft.

          Du darfst:
            - das Paket privat nutzen, auch auf Servern und in Videos/Streams.

          Du darfst NICHT:
            - das Paket oder Teile davon weiterverbreiten, neu hochladen oder weiterverkaufen,
            - Dateien daraus in eigene Packs oder Mods übernehmen.

          NICHT OFFIZIELLES MINECRAFT-PRODUKT. NICHT VON MOJANG ODER MICROSOFT GENEHMIGT
          ODER MIT IHNEN VERBUNDEN.
          AURORA_EOF
          mkdir -p "$(dirname 'gen/LIESMICH.txt')"
          cat > 'gen/LIESMICH.txt' <<'AURORA_EOF'
          AURORA SKIES v1.0 - Resource Pack
          =================================

          Inhalt
            - 4 eigene Himmel: Tag (Wolken), Sonnenuntergang, Nacht mit Nordlicht + Milchstraße, End-Nebel
              (sanfte Übergänge je nach Tageszeit)
            - eigene Sonne, eigene Mondphasen, eigene Wolken
            - eigenes Titelbild-Panorama (Sonnenuntergang über Bergen)
            - eigene UI-Sounds: Button-Klick, Toast rein/raus, Erfolg erreicht, Level-Up, XP
            - eigene Menümusik (ambient)
            - eigene Splash-Texte im Hauptmenü

          Installation
            1. ZIP NICHT entpacken, sondern nach .minecraft/resourcepacks kopieren.
            2. In Minecraft: Optionen > Ressourcenpakete > "Aurora Skies" aktivieren.

          Himmel benötigen EINE dieser Mods:
            - OptiFine (Forge/Vanilla) oder
            - FabricSkyboxes (Fabric/Quilt)
          Sounds, Musik, Panorama, Sonne/Mond, Wolken und Splashes funktionieren auch ohne Mods.

          Getestet für Java Edition 1.21.x.
          AURORA_EOF

      - name: Himmel, Texturen und Sounds erzeugen (ca. 5-10 Min.)
        shell: bash
        env:
          AURORA_OUT: ${{ github.workspace }}/out
          AURORA_MODRES: ${{ github.workspace }}/aurora-mod/src/main/resources
        run: |
          set -e
          cd gen
          python build.py
          python deepspace.py
          rm -rf "$AURORA_MODRES/resourcepacks/aurora_deepspace"
          cp -r "$AURORA_OUT/AuroraSkies_DeepSpace" "$AURORA_MODRES/resourcepacks/aurora_deepspace"
          cd "$AURORA_OUT/AuroraSkies_DeepSpace" && zip -qr "$AURORA_OUT/AuroraSkies_DeepSpace_Addon_v1.0.zip" .

      - name: Gradle 8.12 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Mod bauen
        working-directory: aurora-mod
        run: gradle build --no-daemon --stacktrace

      - name: Fertige Mod (.jar) hochladen
        uses: actions/upload-artifact@v4
        with:
          name: aurora-skies-mod-jar
          path: |
            aurora-mod/build/libs/*.jar
            !aurora-mod/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Resource-Packs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: aurora-skies-resourcepacks
          path: |
            out/AuroraSkies_v1.0.zip
            out/AuroraSkies_DeepSpace_Addon_v1.0.zip

      - name: Vorschaubilder hochladen
        uses: actions/upload-artifact@v4
        with:
          name: aurora-skies-vorschau
          path: out/previews/*.png
